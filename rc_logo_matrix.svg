<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>RC logo animado — Matrix EDA</title>
  <desc>Logo ASCII animado con estética Matrix para el README del proyecto EDA_matrix_decodificada</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .ascii {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 15px;
        fill: #00ff41;
        text-anchor: start;
      }

      .ascii-row { animation: faderow 0.5s ease both; }
      .r1 { animation-delay: 0.1s; }
      .r2 { animation-delay: 0.25s; }
      .r3 { animation-delay: 0.4s; }
      .r4 { animation-delay: 0.55s; }
      .r5 { animation-delay: 0.7s; }
      .r6 { animation-delay: 0.85s; }

      @keyframes faderow {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      .glow { animation: pulse 3s ease-in-out infinite, glitch 9s step-end infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.8; }
      }
      @keyframes glitch {
        0%, 88%, 100% { transform: translateX(0); }
        90%           { transform: translateX(-2px); }
        93%           { transform: translateX(2px); }
        96%           { transform: translateX(-1px); }
      }

      .byline {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 13px;
        fill: #00cc33;
        text-anchor: middle;
        animation: faderow 0.6s ease 1.1s both;
      }

      .cursor {
        fill: #00ff41;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }

      .scanline {
        fill: none;
        stroke: #00ff41;
        stroke-width: 1;
        opacity: 0.12;
        animation: scan 2.8s linear infinite;
      }
      @keyframes scan {
        0%   { transform: translateY(0px); }
        100% { transform: translateY(220px); }
      }

      .corner { stroke: #00ff4145; stroke-width: 1.5; fill: none; }

      .title {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #ccffdd;
        letter-spacing: 3px;
        text-anchor: middle;
        animation: faderow 0.6s ease 1.5s both;
      }

      .divider {
        stroke: #00ff4130;
        stroke-width: 1;
        animation: growline 0.8s ease 1.8s both;
        transform-origin: 340px 168px;
      }
      @keyframes growline {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }

      .rain-col {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        text-anchor: middle;
        opacity: 0;
        animation: rainin 0.6s ease forwards;
      }
      .ra { animation-delay: 2.0s; }
      .rb { animation-delay: 2.15s; }
      .rc { animation-delay: 2.3s; }
      @keyframes rainin {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .bg-rect { fill: #050f05; }
    </style>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect class="bg-rect" x="0" y="0" width="680" height="220" rx="8"/>
  <line class="scanline" x1="0" y1="-220" x2="680" y2="-220"/>

  <polyline class="corner" points="24,14 14,14 14,24"/>
  <polyline class="corner" points="656,14 666,14 666,24"/>
  <polyline class="corner" points="24,206 14,206 14,196"/>
  <polyline class="corner" points="656,206 666,206 666,196"/>

  <!-- lluvia de código izquierda — columna A -->
  <g class="rain-col ra">
    <text filter="url(#glow)" opacity="1.00" x="38" y="75"  fill="#ccffdd">1</text>
    <text                      opacity="0.65" x="38" y="88"  fill="#00ff41">0</text>
    <text                      opacity="0.40" x="38" y="101" fill="#00ff41">7</text>
    <text                      opacity="0.20" x="38" y="114" fill="#00ff41">3</text>
    <text                      opacity="0.08" x="38" y="127" fill="#00ff41">/</text>
  </g>

  <!-- lluvia de código izquierda — columna B -->
  <g class="rain-col rb">
    <text filter="url(#glow)" opacity="1.00" x="60" y="105" fill="#ccffdd">Z</text>
    <text                      opacity="0.65" x="60" y="118" fill="#00ff41">1</text>
    <text                      opacity="0.40" x="60" y="131" fill="#00ff41">4</text>
    <text                      opacity="0.20" x="60" y="144" fill="#00ff41">#</text>
    <text                      opacity="0.65" x="60" y="83"  fill="#00ff41">0</text>
    <text                      opacity="0.30" x="60" y="70"  fill="#00ff41">8</text>
  </g>

  <!-- lluvia de código izquierda — columna C -->
  <g class="rain-col rc">
    <text filter="url(#glow)" opacity="1.00" x="82" y="88"  fill="#ccffdd">/</text>
    <text                      opacity="0.65" x="82" y="101" fill="#00ff41">1</text>
    <text                      opacity="0.40" x="82" y="114" fill="#00ff41">0</text>
    <text                      opacity="0.20" x="82" y="127" fill="#00ff41">+</text>
    <text                      opacity="0.50" x="82" y="75"  fill="#00ff41">9</text>
  </g>

  <!-- lluvia de código derecha — columna A (espejo) -->
  <g class="rain-col ra">
    <text filter="url(#glow)" opacity="1.00" x="642" y="75"  fill="#ccffdd">1</text>
    <text                      opacity="0.65" x="642" y="88"  fill="#00ff41">0</text>
    <text                      opacity="0.40" x="642" y="101" fill="#00ff41">7</text>
    <text                      opacity="0.20" x="642" y="114" fill="#00ff41">3</text>
    <text                      opacity="0.08" x="642" y="127" fill="#00ff41">/</text>
  </g>

  <!-- lluvia de código derecha — columna B (espejo) -->
  <g class="rain-col rb">
    <text filter="url(#glow)" opacity="1.00" x="620" y="105" fill="#ccffdd">Z</text>
    <text                      opacity="0.65" x="620" y="118" fill="#00ff41">1</text>
    <text                      opacity="0.40" x="620" y="131" fill="#00ff41">4</text>
    <text                      opacity="0.20" x="620" y="144" fill="#00ff41">#</text>
    <text                      opacity="0.65" x="620" y="83"  fill="#00ff41">0</text>
    <text                      opacity="0.30" x="620" y="70"  fill="#00ff41">8</text>
  </g>

  <!-- lluvia de código derecha — columna C (espejo) -->
  <g class="rain-col rc">
    <text filter="url(#glow)" opacity="1.00" x="598" y="88"  fill="#ccffdd">/</text>
    <text                      opacity="0.65" x="598" y="101" fill="#00ff41">1</text>
    <text                      opacity="0.40" x="598" y="114" fill="#00ff41">0</text>
    <text                      opacity="0.20" x="598" y="127" fill="#00ff41">+</text>
    <text                      opacity="0.50" x="598" y="75"  fill="#00ff41">9</text>
  </g>

  <g class="glow">
    <text class="ascii ascii-row r1" x="268" y="62">&#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2557;  &#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2557;</text>
    <text class="ascii ascii-row r2" x="268" y="80">&#x2588;&#x2588;&#x2554;&#x2550;&#x2550;&#x2588;&#x2588;&#x2557;&#x2588;&#x2588;&#x2554;&#x2550;&#x2550;&#x2550;&#x2550;&#x255D;</text>
    <text class="ascii ascii-row r3" x="268" y="98">&#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2554;&#x255D;&#x2588;&#x2588;&#x2551;&#x00A0;&#x00A0;&#x00A0;&#x00A0;&#x00A0;</text>
    <text class="ascii ascii-row r4" x="268" y="116">&#x2588;&#x2588;&#x2554;&#x2550;&#x2550;&#x2588;&#x2588;&#x2557;&#x2588;&#x2588;&#x2551;&#x00A0;&#x00A0;&#x00A0;&#x00A0;&#x00A0;</text>
    <text class="ascii ascii-row r5" x="268" y="134">&#x2588;&#x2588;&#x2551;&#x00A0;&#x00A0;&#x2588;&#x2588;&#x2551;&#x255A;&#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2588;&#x2557;</text>
    <text class="ascii ascii-row r6" x="268" y="152">&#x255A;&#x2550;&#x255D;&#x00A0;&#x00A0;&#x255A;&#x2550;&#x255D;&#x00A0;&#x255A;&#x2550;&#x2550;&#x2550;&#x2550;&#x2550;&#x255D;</text>
  </g>

  <line class="divider" x1="200" y1="168" x2="480" y2="168"/>

  <text class="byline" x="340" y="184">&gt; by Roberto Cantero</text>
  <rect class="cursor" x="476" y="172" width="8" height="13" rx="1"/>

  <text class="title" x="340" y="205">EDA MATRIX DECODIFICADA</text>
</svg>
